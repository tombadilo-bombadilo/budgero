name: ci

# PR checks run on GitHub-hosted runners. Enable DELL_RUNNER_ENABLED after
# runner verification to run master builds on the isolated Dell VM.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Do not filter workflow triggers by path: required web/server checks must report.
# Short required gates fail closed if selection or an affected build fails.
# Keep always() off expensive jobs so obsolete builds remain cancellable.
jobs:
  changes:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the record-pass markers of pull request runs.
      actions: read
    outputs:
      app: ${{ steps.paths.outputs.app }}
      website: ${{ steps.paths.outputs.website }}
      server: ${{ steps.paths.outputs.server }}
      tree: ${{ steps.paths.outputs.tree }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test change selection
        run: node --test scripts/ci/changes.test.mjs

      - name: Select affected checks
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/changes.mjs

  web-checks:
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.website == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DELL_RUNNER_ENABLED == 'true' && '["self-hosted","linux","x64","budgero-build"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - name: Setup Go
        if: needs.changes.outputs.app == 'true'
        uses: actions/setup-go@v5
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
          go-version-file: packages/server/go.mod
          cache-dependency-path: packages/server/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # core and runtime dist must exist before type-check: app resolves
      # @budgero/core against ../core/dist
      - name: Build core
        if: needs.changes.outputs.app == 'true'
        run: pnpm run build:core

      - name: Build runtime
        if: needs.changes.outputs.app == 'true'
        run: pnpm run build:runtime

      - name: Test release tooling
        if: needs.changes.outputs.app == 'true'
        run: node --experimental-strip-types --test scripts/release.test.mjs

      - name: Type-check
        if: needs.changes.outputs.app == 'true'
        run: pnpm run type-check:all

      - name: Lint core
        if: needs.changes.outputs.app == 'true'
        run: pnpm run lint:core

      - name: Lint runtime
        if: needs.changes.outputs.app == 'true'
        run: pnpm run lint:runtime

      - name: Lint app
        if: needs.changes.outputs.app == 'true'
        run: pnpm run lint:app

      - name: Check translation catalogs
        if: needs.changes.outputs.app == 'true'
        run: pnpm run i18n:check

      - name: Audit untranslated strings
        if: needs.changes.outputs.app == 'true'
        run: pnpm run i18n:sweep

      - name: Test core
        if: needs.changes.outputs.app == 'true'
        run: pnpm run test:core

      - name: Test runtime
        if: needs.changes.outputs.app == 'true'
        run: pnpm --dir packages/runtime run test

      - name: Test app
        if: needs.changes.outputs.app == 'true'
        run: pnpm run test:app

      - name: Build app + server binary
        if: needs.changes.outputs.app == 'true'
        run: pnpm run build:app

      - name: Check Contentlayer tracing compatibility
        if: needs.changes.outputs.website == 'true'
        run: pnpm --dir packages/website run test:tracing

      - name: Build website
        if: needs.changes.outputs.website == 'true'
        run: pnpm run build:website

      - name: Check changelog crawlability
        if: needs.changes.outputs.website == 'true'
        run: pnpm --dir packages/website run test:changelog

      - name: Type-check website
        if: needs.changes.outputs.website == 'true'
        run: pnpm --dir packages/website exec tsc --noEmit

      - name: Audit translated website pages
        if: needs.changes.outputs.website == 'true'
        run: node scripts/i18n/audit-website.mjs --max 0

      - name: Validate generated app knowledge
        if: needs.changes.outputs.website == 'true' && needs.changes.outputs.app != 'true'
        run: |
          node packages/app/scripts/build-knowledge.mjs
          node --experimental-strip-types --check packages/app/src/features/ai/lib/knowledge/knowledge-base.generated.ts

  server-checks:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DELL_RUNNER_ENABLED == 'true' && '["self-hosted","linux","x64","budgero-build"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
          go-version-file: packages/server/go.mod
          cache-dependency-path: packages/server/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.7.2
          # goinstall compiles with the job's Go toolchain; release binaries
          # are built with older Go and refuse newer go.mod targets
          install-mode: goinstall
          working-directory: packages/server

  web:
    needs: [changes, web-checks]
    if: always() && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful affected checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.web-checks.result }}
          SELECTED: ${{ needs.changes.outputs.app == 'true' || needs.changes.outputs.website == 'true' }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$SELECTED" = true ]; then
            test "$CHECKS_RESULT" = success
          else
            test "$CHECKS_RESULT" = skipped
          fi

  server:
    needs: [changes, server-checks]
    if: always() && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful affected checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.server-checks.result }}
          SELECTED: ${{ needs.changes.outputs.server == 'true' }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$SELECTED" = true ]; then
            test "$CHECKS_RESULT" = success
          else
            test "$CHECKS_RESULT" = skipped
          fi

  # Marks the exact tree this pull request tested as passing. When the PR is
  # merged and master's tree is identical (master didn't move meanwhile), the
  # push run finds the marker and skips the suite instead of repeating it.
  record-pass:
    needs: [changes, web, server]
    if: github.event_name == 'pull_request' && needs.changes.outputs.tree != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write marker
        run: echo "${{ needs.changes.outputs.tree }}" > tree.txt
      - name: Upload marker
        uses: actions/upload-artifact@v4
        with:
          name: ci-passed-${{ needs.changes.outputs.tree }}
          path: tree.txt
          retention-days: 14
          overwrite: true
